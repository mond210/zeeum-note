<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zeeum-note</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-screen="editor">
    <div class="shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Markdown workspace</p>
          <h1>zeeum-note</h1>
          <p class="brand-copy">노트 매니저와 마크다운 에디터를 한 화면에서 관리합니다.</p>
        </div>
        <div class="topbar-actions">
          <div class="screen-toggle" aria-label="mobile navigation">
            <button type="button" class="screen-toggle__button" data-screen-button="manager">Manager</button>
            <button type="button" class="screen-toggle__button" data-screen-button="editor">Editor</button>
          </div>
          <div class="status-pill" id="statusPill" data-tone="idle">준비됨</div>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel manager-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Library</p>
              <h2>Text Manager</h2>
            </div>
            <button type="button" class="ghost-button" id="refreshButton">새로고침</button>
          </div>

          <div class="manager-toolbar">
            <label class="search-field">
              <span>Search</span>
              <input id="searchInput" type="search" placeholder="제목이나 내용 검색" />
            </label>
            <button type="button" class="primary-button" id="createButton">새 노트</button>
          </div>

          <div class="manager-meta">
            <span id="noteCount">0 notes</span>
          </div>

          <div class="notes-list" id="notesList"></div>
        </aside>

        <section class="panel editor-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Studio</p>
              <h2>Markdown Editor</h2>
            </div>
            <button type="button" class="ghost-button" id="saveButton">지금 저장</button>
          </div>

          <div class="editor-meta">
            <input id="noteTitle" class="note-title" type="text" placeholder="노트 제목" maxlength="120" />
            <div class="editor-meta__details">
              <span id="noteStamp">노트를 선택하세요.</span>
              <span id="editorStats">0 words · 0 chars</span>
            </div>
          </div>

          <div class="editor-grid">
            <section class="editor-card">
              <div class="card-header">
                <h3>Write</h3>
                <p>자동 저장됩니다. `Cmd/Ctrl + S`로 즉시 저장할 수 있습니다.</p>
              </div>
              <textarea id="editorInput" class="editor-input" placeholder="# 새 노트를 시작하세요"></textarea>
            </section>

            <section class="preview-card">
              <div class="card-header">
                <h3>Preview</h3>
                <p>서버에서 마크다운을 렌더링하고 안전하게 정리합니다.</p>
              </div>
              <div id="previewPane" class="preview-pane">
                <div class="empty-preview">노트를 선택하면 미리보기가 여기에 표시됩니다.</div>
              </div>
            </section>
          </div>

          <div class="empty-editor" id="emptyEditor" hidden>
            <p>아직 노트가 없습니다.</p>
            <button type="button" class="primary-button" id="emptyCreateButton">첫 노트 만들기</button>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
